name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Testes (Linux, com display virtual para o teste da interface)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

name: Release

# Publica executáveis prontos ao criar uma tag de versão:
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-22.04 (glibc 2.35) para o binário rodar no maior número de distros
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Testes
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Compilar executável
        run: python tools/build.py
      # O que vai para a Release é o EXECUTÁVEL, não o código-fonte: testa o binário pela CLI
      # (JSON, códigos de saída, treemap, exportação, acentos) antes de publicar.
      - name: Teste de fumaça do executável (Windows)
        if: runner.os == 'Windows'
        run: python tools/smoke_exe.py dist/ReperIO.exe
      - name: Teste de fumaça do executável (Linux)
        if: runner.os == 'Linux'
        run: python tools/smoke_exe.py dist/ReperIO
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.os }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Somas SHA-256
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Texto da Release = seção da versão no CHANGELOG (falha se ela não existir)
      - name: Notas da Release (a partir do CHANGELOG)
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md && cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
